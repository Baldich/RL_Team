spring.application.name=protube-back
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.port=8080
spring.thymeleaf.prefix=classpath:/static/
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.profiles.active=@spring.profiles.active@

# Absolute video store path, including its trailing slash.
pro_tube.store.dir=${ENV_PROTUBE_STORE_DIR}
pro_tube.frontend.origin=${ENV_PROTUBE_FRONTEND_ORIGIN:http://localhost:5173}

# Existing OAuth placeholders are retained; US-01 does not enable OAuth.
spring.security.oauth2.client.registration.google.client-id=${ENV_PROTUBE_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${ENV_PROTUBE_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# Both runtime profiles use PostgreSQL; credentials come from the environment.
spring.datasource.url=jdbc:postgresql://${ENV_PROTUBE_DB_HOST:localhost}:5432/${ENV_PROTUBE_DB}
spring.datasource.username=${ENV_PROTUBE_DB_USER}
spring.datasource.password=${ENV_PROTUBE_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${ENV_PROTUBE_SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-binding-errors=never
logging.level.org.springframework.web=INFO
# Avoid SQL exception details containing submitted account data.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

#---
spring.config.activate.on-profile=dev
pro_tube.load_initial_data=true
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

#---
spring.config.activate.on-profile=prod
pro_tube.load_initial_data=false
spring.mvc.static-path-pattern=/media/**
